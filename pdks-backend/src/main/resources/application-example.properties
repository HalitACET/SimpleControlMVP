# ==========================================
# PDKS BACKEND AYAR ŞABLONU
# Bu dosyanın adını "application.properties" olarak değiştirip kendi bilgilerinizi girin.
# ==========================================

# Sunucu Portu
server.port=8080

# ── Veritabanı Bağlantısı (PostgreSQL) ──────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/simplecontrol
spring.datasource.username=postgres
spring.datasource.password=SIFRENIZI_YAZIN
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Hibernate / JPA ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# ── JWT Ayarları ─────────────────────────────────────────────────────────────
# En az 256-bit (32 karakter) güçlü bir secret key kullanın
jwt.secret=BURAYA_GIZLI_JWT_ANAHTARINIZI_YAZIN
jwt.expiration=86400000
