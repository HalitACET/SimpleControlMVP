# ==========================================
# PDKS BACKEND AYAR ŞABLONU
# Bu dosyanın adını "application.properties" olarak değiştirip kendi bilgilerinizi girin.
#
# ${DEGISKEN:varsayilan} yazımı: ortam değişkeni varsa o kullanılır,
# yoksa iki nokta üst üsteden sonraki varsayılan değer geçerli olur.
# Sunucuda (Render/Railway) yalnızca ortam değişkenlerini tanımlamak yeterlidir.
# ==========================================

# Sunucu Portu
server.port=${PORT:8080}

# ── Veritabanı Bağlantısı (PostgreSQL) ──────────────────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/simplecontrol}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:BURAYA_SIFRE}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Hibernate / JPA ──────────────────────────────────────────────────────────
# Şema DEĞİŞİKLİĞİ sadece Flyway migration ile yapılır, ddl-auto=validate kalmalı
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# ── Flyway ───────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── JWT Ayarları ─────────────────────────────────────────────────────────────
# En az 256-bit (32 karakter) güçlü bir secret key kullanın
jwt.secret=${JWT_SECRET:BURAYA_GIZLI_JWT_ANAHTARINIZI_YAZIN}
jwt.expiration=86400000

# ── CORS ─────────────────────────────────────────────────────────────────────
# Web panelinin adresi. Birden fazla adres virgülle ayrılır:
# https://panel.ornek.com,https://staging.ornek.com
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ── Profil ───────────────────────────────────────────────────────────────────
# Sunucuda SPRING_PROFILES_ACTIVE=prod ortam değişkeni bu satırı ezer
spring.profiles.active=dev

# ── Saat Dilimi ──────────────────────────────────────────────────────────────
spring.jackson.time-zone=Europe/Istanbul
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Istanbul
