# Sunucu Portu
server.port=${PORT:8080}

# Veritabanı Bağlantısı (PostgreSQL)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/simplecontrol}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret=${JWT_SECRET:jPr3uAMNe9utlcY+8v+MTUBSEZhKzbgS1Le/z5D4U6WY90/SKnsiObGEFty0mNbj}
jwt.expiration=86400000

# CORS — virgülle ayrılmış origin listesi
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Profil
spring.profiles.active=dev

# Saat Dilimi
spring.jackson.time-zone=Europe/Istanbul
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Istanbul
